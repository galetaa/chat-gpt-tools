<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>ChatGPT Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ls-popup">
    <div class="ls-ambient-glow" aria-hidden="true"></div>

    <header class="ls-header">
      <div class="ls-brand">
        <span class="ls-app-icon" aria-hidden="true">
          <img src="../icons/icon-32.png" alt="">
        </span>
        <span class="ls-brand-copy">
          <span class="ls-brand-title-row">
            <h1>ChatGPT Tools</h1>
            <span class="ls-platform-badge" id="platformBadge">Browser</span>
          </span>
          <span class="ls-state" id="extensionState">
            <span class="ls-state-dot"></span>
            <span id="extensionStateLabel">Active</span>
          </span>
        </span>
      </div>
      <input
        type="checkbox"
        switch
        id="enableToggle"
        class="ls-switch ls-switch--master"
        aria-label="Enable conversation optimization"
      >
    </header>

    <main class="ls-main">
      <section class="ls-tool-card" aria-labelledby="exportTitle">
        <span class="ls-tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7 3.5h7l4 4V20H7z"></path>
            <path d="M14 3.5V8h4M12.5 11v5M10.5 14l2 2 2-2"></path>
          </svg>
        </span>
        <span class="ls-tool-copy">
          <span class="ls-eyebrow">Conversation tools</span>
          <strong id="exportTitle">Export Conversation</strong>
          <small>Choose messages · MD, TXT, JSON, CSV, PDF</small>
        </span>
        <button
          type="button"
          id="exportConversationButton"
          class="ls-tool-button"
          title="Open the conversation export panel in ChatGPT"
        >
          Open
        </button>
      </section>

      <section class="ls-performance-card" id="retentionCard" aria-labelledby="retentionTitle">
        <div class="ls-performance-heading">
          <div>
            <span class="ls-eyebrow">Performance</span>
            <h2 id="retentionTitle">Recent context window</h2>
          </div>
          <label class="ls-value" for="keepValueInput">
            <input
              type="number"
              id="keepValueInput"
              class="ls-value-input"
              min="1"
              max="20"
              step="1"
              value="10"
              inputmode="numeric"
              aria-label="Custom number of messages to retain"
            >
            <span>messages</span>
          </label>
        </div>

        <input
          type="range"
          id="keepSlider"
          class="ls-slider"
          min="1"
          max="20"
          step="1"
          value="10"
          aria-label="Number of messages to retain"
          aria-valuemin="1"
          aria-valuemax="20"
          aria-valuenow="10"
        >
        <div class="ls-slider-labels" aria-hidden="true">
          <span id="sliderMinimum">1</span>
          <span id="sliderMidpoint">10</span>
          <span id="sliderMaximum">20</span>
        </div>

        <label class="ls-inline-setting" for="extendedRangeToggle">
          <span>
            <strong>Extended range</strong>
            <small id="rangeDescription">Allow up to 100 messages</small>
          </span>
          <input
            type="checkbox"
            switch
            id="extendedRangeToggle"
            class="ls-switch ls-switch--mini"
            aria-describedby="rangeDescription"
          >
        </label>
      </section>

      <section class="ls-section" id="optionsCard" aria-labelledby="optionsTitle">
        <h2 id="optionsTitle">Options</h2>
        <div class="ls-group">
          <label class="ls-setting-row" for="showStatusBarCheckbox">
            <span class="ls-row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 12h3l2-5 4 10 2-5h5"></path>
              </svg>
            </span>
            <span class="ls-setting-copy">
              <span class="ls-setting-title">Activity Indicator</span>
              <span class="ls-setting-description">Show trimming results in ChatGPT</span>
            </span>
            <input
              type="checkbox"
              switch
              id="showStatusBarCheckbox"
              class="ls-switch ls-switch--mini"
              aria-label="Show activity indicator"
            >
          </label>

          <label class="ls-setting-row" for="collapseLongUserMessagesCheckbox">
            <span class="ls-row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 7h14M5 11h10M5 15h12"></path>
                <path d="m16 18 2 2 2-2"></path>
              </svg>
            </span>
            <span class="ls-setting-copy">
              <span class="ls-setting-title">Compact Long Prompts</span>
              <span class="ls-setting-description">Collapse tall messages until expanded</span>
            </span>
            <input
              type="checkbox"
              switch
              id="collapseLongUserMessagesCheckbox"
              class="ls-switch ls-switch--mini"
              aria-label="Compact long prompts"
            >
          </label>
        </div>
      </section>

      <section class="ls-section ls-section--developer" id="debugGroup" hidden aria-labelledby="developerTitle">
        <h2 id="developerTitle">Developer</h2>
        <div class="ls-group">
          <label class="ls-setting-row" for="debugCheckbox">
            <span class="ls-row-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M8 9h8M8 13h8M10 17h4"></path>
                <path d="M6 4h12v16H6z"></path>
              </svg>
            </span>
            <span class="ls-setting-copy">
              <span class="ls-setting-title">Debug Logging</span>
              <span class="ls-setting-description">Write diagnostic events to the console</span>
            </span>
            <input
              type="checkbox"
              switch
              id="debugCheckbox"
              class="ls-switch ls-switch--mini"
              aria-label="Enable debug logging"
            >
          </label>
        </div>
      </section>
    </main>

    <footer class="ls-footer">
      <span class="ls-privacy">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3.5" y="7" width="9" height="6.5" rx="2"></rect>
          <path d="M5.5 7V5.5a2.5 2.5 0 0 1 5 0V7"></path>
        </svg>
        On-device
      </span>
      <div id="status" class="ls-status" role="status" aria-live="polite"></div>
      <span class="ls-version" id="version"></span>
    </footer>
  </div>

  <script src="../scripts/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
